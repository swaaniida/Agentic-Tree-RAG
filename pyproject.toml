[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-tree-rag"
version = "0.1.0"
description = "Structure-aware agentic retrieval for long-document question answering"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "swaaniida" }]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
